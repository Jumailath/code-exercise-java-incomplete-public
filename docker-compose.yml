services:
  api:
    build: ./backend
    environment:
      DATABASE_PATH: /data/urlshortener.db
      SERVER_PORT: "8080"
    volumes:
      - url-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80" # open http://localhost:3000
    restart: unless-stopped

volumes:
  url-data:
